<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Reasonix Browser Prototype</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
*{box-sizing:border-box}body{margin:0;color:#233448;background:#f0f3f6;font:14px system-ui}header{height:54px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #cdd6df;gap:14px}header b{font-size:16px}header span{font-size:12px;color:#687789}#layout{display:flex;height:calc(100vh - 54px)}aside{width:290px;min-width:200px;max-width:480px;padding:20px;overflow:auto}h2{font-size:16px}p{line-height:1.7;color:#667788}button{font:inherit;cursor:pointer;border:1px solid #c3ccd7;border-radius:6px;background:white;color:#263d53;padding:8px 11px}aside button{display:block;width:100%;margin:10px 0}button.primary{background:#185c4b;color:white;border-color:#185c4b}#status{padding:12px;background:#e1eae7;border-radius:8px;line-height:1.6;overflow-wrap:anywhere}#log{white-space:pre-wrap;font:12px/1.7 monospace;color:#65758a}#splitter{width:6px;cursor:col-resize;background:#d5dde5;flex-shrink:0}#browser{flex:1;min-width:260px;display:flex;flex-direction:column}#tabs{height:38px;display:flex;align-items:center;gap:5px;padding:4px 8px;overflow:hidden}#tabs button{padding:4px 9px;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#tabs button.active{background:#d9e7ef}#toolbar{display:flex;gap:5px;padding:7px 8px;height:48px;background:#fff;border-bottom:1px solid #d9e0e7}#url{font:inherit;flex:1;min-width:60px;border:1px solid #ccd5df;border-radius:6px;padding:8px}#viewport{flex:1;background:white}#version{font:11px/1.6 monospace;color:#6b7a8a}
</style>
<header><b>Reasonix / Browser Lab</b><span>Electron + Go · 原生视图验证</span></header>
<div id="layout"><aside><h2>共用一个浏览器</h2><p>右侧是真实的 Chromium 页面。左侧通过 Go 进程生成固定测试动作，验证宿主和浏览器之间的控制链路。</p><div id="status">正在启动…</div><button class="primary" id="run">运行 Go 测试动作</button><button id="takeover">接管页面</button><button id="resume">读取新状态并继续</button><button id="crash">测试页面崩溃与恢复</button><button id="metrics">记录资源占用</button><h2>验证日志</h2><div id="log"></div><p id="version"></p></aside><div id="splitter" role="separator" aria-label="调整分栏" tabindex="0"></div><div id="browser"><div id="tabs"></div><form id="toolbar"><button type="button" id="back" aria-label="后退">←</button><button type="button" id="forward" aria-label="前进">→</button><button type="button" id="reload" aria-label="刷新">↻</button><input id="url" aria-label="网址"><button type="button" id="new" aria-label="新标签">＋</button><button type="button" id="zoom-out" aria-label="缩小页面">−</button><button type="button" id="zoom-in" aria-label="放大页面">＋</button><button type="button" id="devtools">DevTools</button></form><div id="viewport"></div></div></div>
<script src="shell.cjs"></script><script src="runtime-ui.cjs"></script></html>
