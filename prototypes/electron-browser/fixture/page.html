<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reasonix · Browser fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#15243b;font:15px/1.65 system-ui,sans-serif}main{max-width:860px;padding:34px;margin:auto}h1{font-size:30px;letter-spacing:-1px;margin:10px 0}small{color:#567084}section{background:white;border:1px solid #dce3eb;border-radius:12px;padding:22px;margin:20px 0}label{display:block;margin-bottom:8px}textarea,input{font:inherit;border:1px solid #aab9ca;border-radius:7px;padding:10px;width:100%}textarea{height:100px}button,a.action{font:inherit;padding:9px 14px;border:1px solid #becbd8;border-radius:7px;background:#fff;color:#173e61;cursor:pointer;margin:8px 8px 0 0;display:inline-block}button.primary{background:#185c4b;color:white;border-color:#185c4b}output{display:block;white-space:pre-wrap;min-height:24px;color:#185c4b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.row{padding:12px;border-bottom:1px solid #eee}#events{font:12px monospace;white-space:pre-wrap;max-height:90px;overflow:auto}footer{padding:20px;color:#567084}@media(max-width:600px){main{padding:16px}.grid{grid-template-columns:1fr}h1{font-size:24px}}
</style>
<main>
<small>NATIVE BROWSER / LOCAL FIXTURE</small><h1>人和 Agent，共用一个页面</h1><p>验证原生输入、会话登录、分栏布局和可中断的操作。此页面没有真实账户或外部服务。</p>
<section><label for="message">输入与交接</label><textarea id="message" placeholder="输入中文，或运行左侧 Go 操作"></textarea><button id="save" class="primary">保存内容</button><button id="reset">清空</button><output id="saved"></output><small id="save-count">提交次数：0</small><div id="events"></div></section>
<div class="grid"><section><h2>弹窗登录</h2><output id="login-state">检查登录状态…</output><button id="login">打开登录弹窗</button><button id="check-login">刷新登录状态</button></section><section><h2>文件与页面</h2><input type="file" id="upload"><output id="upload-result"></output><a class="action" href="/download" id="download">下载测试 CSV</a><a class="action" href="/?page=next" id="next">下一页</a></section></div>
<section><h2>原生文本选择</h2><p id="selectable">Browser selection · 中文复制粘贴 · 文字应直接由浏览器渲染。</p><p>当前 viewport：<span id="viewport"></span></p></section>
<section id="long-content"><h2>滚动测试</h2></section><footer id="bottom">已到页面底部</footer>
</main>
<script>
const $=s=>document.querySelector(s);let saves=0;window.fixtureEvents=[];
function record(event){window.fixtureEvents.push({type:event.type,data:event.data??null,isTrusted:event.isTrusted});$('#events').textContent=JSON.stringify(window.fixtureEvents.slice(-5),null,1)}
for(const type of ['compositionstart','compositionupdate','compositionend','input'])$('#message').addEventListener(type,record);
$('#save').onclick=()=>{$('#saved').textContent=$('#message').value;$('#save-count').textContent=`提交次数：${++saves}`;};
$('#reset').onclick=()=>{$('#message').value='';$('#saved').textContent=''};
async function sessionState(){const data=await fetch('/session').then(r=>r.json());$('#login-state').textContent=data.authenticated?'已登录（测试会话）':'尚未登录'}
$('#login').onclick=()=>window.open('/auth','fixture-login','width=440,height=340');
$('#check-login').onclick=sessionState;addEventListener('message',e=>{if(e.origin===location.origin&&e.data.type==='fixture-login')sessionState()});
$('#upload').onchange=e=>$('#upload-result').textContent=e.target.files[0]?.name??'';
for(let i=0;i<35;i++){const p=document.createElement('div');p.className='row';p.textContent=`测试内容 ${i+1} · Native scrolling`;$('#long-content').append(p)}
function size(){$('#viewport').textContent=`${innerWidth} × ${innerHeight} / DPR ${devicePixelRatio}`}addEventListener('resize',size);size();sessionState();
</script></html>
